<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品中心 - 简仪科技锐视测控平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/products.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'jytek-blue': '#1e40af',
                        'jytek-light-blue': '#3b82f6',
                        'jytek-gray': '#6b7280'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <h1 class="text-xl font-bold text-gray-900">简仪科技 - 产品中心</h1>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-gray-600 hover:text-gray-900 transition-colors">
                        <i class="fas fa-home mr-2"></i>返回首页
                    </a>
                    <a href="/knowledge.html" class="text-gray-600 hover:text-gray-900 transition-colors">
                        <i class="fas fa-book mr-2"></i>知识库
                    </a>
                    <button id="ai-assistant-btn" class="bg-jytek-blue hover:bg-jytek-light-blue text-white px-4 py-2 rounded-lg transition-colors">
                        <i class="fas fa-robot mr-2"></i>AI助手
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="flex flex-col lg:flex-row gap-6">
            
            <!-- 左侧筛选面板 -->
            <aside class="lg:w-80 flex-shrink-0">
                <div class="bg-white rounded-lg shadow-sm p-6 sticky top-24">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-lg font-semibold text-gray-900">筛选条件</h2>
                        <button id="clear-filters" class="text-sm text-jytek-blue hover:text-jytek-light-blue">
                            <i class="fas fa-times mr-1"></i>清除
                        </button>
                    </div>

                    <!-- 搜索框 -->
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">产品搜索</label>
                        <div class="relative">
                            <input type="text" id="search-input" 
                                   placeholder="搜索产品名称、型号或关键词..." 
                                   class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-jytek-blue focus:border-transparent">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-search text-gray-400"></i>
                            </div>
                        </div>
                        <!-- 搜索建议 -->
                        <div id="search-suggestions" class="hidden absolute z-10 w-full bg-white border border-gray-200 rounded-lg shadow-lg mt-1">
                        </div>
                    </div>

                    <!-- 产品分类 -->
                    <div class="mb-6">
                        <h3 class="text-sm font-medium text-gray-900 mb-3">产品分类</h3>
                        <div id="category-filters" class="space-y-2">
                            <button class="category-filter active w-full text-left px-3 py-2 rounded-lg text-sm hover:bg-gray-100 bg-jytek-blue text-white" 
                                    data-category="">
                                全部分类 (<span id="total-count">0</span>)
                            </button>
                        </div>
                    </div>

                    <!-- 价格区间 -->
                    <div class="mb-6">
                        <h3 class="text-sm font-medium text-gray-900 mb-3">价格区间</h3>
                        <div class="space-y-2">
                            <label class="flex items-center">
                                <input type="checkbox" class="price-filter rounded border-gray-300 text-jytek-blue focus:ring-jytek-blue" value="0-5000">
                                <span class="ml-2 text-sm text-gray-700">¥5,000以下</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" class="price-filter rounded border-gray-300 text-jytek-blue focus:ring-jytek-blue" value="5000-15000">
                                <span class="ml-2 text-sm text-gray-700">¥5,000 - ¥15,000</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" class="price-filter rounded border-gray-300 text-jytek-blue focus:ring-jytek-blue" value="15000-50000">
                                <span class="ml-2 text-sm text-gray-700">¥15,000 - ¥50,000</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" class="price-filter rounded border-gray-300 text-jytek-blue focus:ring-jytek-blue" value="50000+">
                                <span class="ml-2 text-sm text-gray-700">¥50,000以上</span>
                            </label>
                        </div>
                    </div>

                    <!-- 库存状态 -->
                    <div class="mb-6">
                        <h3 class="text-sm font-medium text-gray-900 mb-3">库存状态</h3>
                        <div class="space-y-2">
                            <label class="flex items-center">
                                <input type="checkbox" class="stock-filter rounded border-gray-300 text-jytek-blue focus:ring-jytek-blue" value="现货">
                                <span class="ml-2 text-sm text-gray-700">现货</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" class="stock-filter rounded border-gray-300 text-jytek-blue focus:ring-jytek-blue" value="预订">
                                <span class="ml-2 text-sm text-gray-700">预订</span>
                            </label>
                        </div>
                    </div>

                    <!-- 技术规格筛选 -->
                    <div class="mb-6">
                        <h3 class="text-sm font-medium text-gray-900 mb-3">技术规格</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-xs text-gray-600 mb-1">通道数</label>
                                <select id="channels-filter" class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-jytek-blue">
                                    <option value="">不限</option>
                                    <option value="1-8">1-8通道</option>
                                    <option value="9-16">9-16通道</option>
                                    <option value="17-32">17-32通道</option>
                                    <option value="32+">32通道以上</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-600 mb-1">分辨率</label>
                                <select id="resolution-filter" class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-jytek-blue">
                                    <option value="">不限</option>
                                    <option value="12">12位</option>
                                    <option value="16">16位</option>
                                    <option value="18">18位</option>
                                    <option value="24">24位</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- 应用筛选器按钮 -->
                    <button id="apply-filters" class="w-full bg-jytek-blue hover:bg-jytek-light-blue text-white py-2 px-4 rounded-lg transition-colors">
                        <i class="fas fa-filter mr-2"></i>应用筛选
                    </button>
                </div>
            </aside>

            <!-- 右侧主内容区 -->
            <main class="flex-1">
                <!-- 工具栏 -->
                <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                        <!-- 左侧：结果统计和筛选标签 -->
                        <div class="flex-1">
                            <div class="flex items-center gap-4 mb-2">
                                <span id="results-count" class="text-sm text-gray-600">共 0 个产品</span>
                                <button id="toggle-mobile-filters" class="lg:hidden text-jytek-blue hover:text-jytek-light-blue">
                                    <i class="fas fa-filter mr-1"></i>筛选
                                </button>
                            </div>
                            <!-- 活跃筛选标签 -->
                            <div id="active-filters" class="flex flex-wrap gap-2">
                            </div>
                        </div>

                        <!-- 右侧：排序和视图控制 -->
                        <div class="flex items-center gap-4">
                            <!-- 排序选择 -->
                            <div class="flex items-center gap-2">
                                <label class="text-sm text-gray-600">排序:</label>
                                <select id="sort-select" class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-jytek-blue">
                                    <option value="name">名称</option>
                                    <option value="price-asc">价格从低到高</option>
                                    <option value="price-desc">价格从高到低</option>
                                    <option value="update-date">最新更新</option>
                                    <option value="popularity">热门程度</option>
                                </select>
                            </div>

                            <!-- 视图切换 -->
                            <div class="flex items-center border border-gray-300 rounded-lg">
                                <button id="grid-view-btn" class="p-2 rounded-l-lg bg-jytek-blue text-white hover:bg-jytek-light-blue transition-colors">
                                    <i class="fas fa-th"></i>
                                </button>
                                <button id="list-view-btn" class="p-2 rounded-r-lg text-gray-600 hover:bg-gray-100 transition-colors">
                                    <i class="fas fa-list"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 产品展示区域 -->
                <div id="products-container">
                    <!-- 加载状态 -->
                    <div id="loading-state" class="hidden">
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <div class="animate-pulse">
                                <div class="bg-gray-300 h-48 rounded-lg mb-4"></div>
                                <div class="bg-gray-300 h-4 rounded mb-2"></div>
                                <div class="bg-gray-300 h-4 rounded w-3/4"></div>
                            </div>
                            <div class="animate-pulse">
                                <div class="bg-gray-300 h-48 rounded-lg mb-4"></div>
                                <div class="bg-gray-300 h-4 rounded mb-2"></div>
                                <div class="bg-gray-300 h-4 rounded w-3/4"></div>
                            </div>
                            <div class="animate-pulse">
                                <div class="bg-gray-300 h-48 rounded-lg mb-4"></div>
                                <div class="bg-gray-300 h-4 rounded mb-2"></div>
                                <div class="bg-gray-300 h-4 rounded w-3/4"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 网格视图 -->
                    <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    </div>

                    <!-- 列表视图 -->
                    <div id="products-list" class="hidden space-y-4">
                    </div>

                    <!-- 空状态 -->
                    <div id="empty-state" class="hidden text-center py-12">
                        <div class="max-w-md mx-auto">
                            <i class="fas fa-search text-6xl text-gray-300 mb-4"></i>
                            <h3 class="text-lg font-medium text-gray-900 mb-2">未找到匹配的产品</h3>
                            <p class="text-gray-600 mb-6">请尝试调整筛选条件或搜索关键词</p>
                            <button id="reset-search" class="bg-jytek-blue hover:bg-jytek-light-blue text-white px-6 py-2 rounded-lg transition-colors">
                                重置搜索
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 分页 -->
                <div id="pagination" class="hidden flex justify-center mt-8">
                </div>

                <!-- 产品对比栏 -->
                <div id="compare-bar" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg p-4 z-40">
                    <div class="max-w-7xl mx-auto flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <span class="text-sm font-medium">产品对比 (<span id="compare-count">0</span>/3)</span>
                            <div id="compare-items" class="flex gap-2">
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button id="clear-compare" class="text-sm text-gray-600 hover:text-gray-900">清除</button>
                            <button id="start-compare" class="bg-jytek-blue hover:bg-jytek-light-blue text-white px-4 py-2 rounded-lg text-sm">
                                开始对比
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- AI助手弹窗 -->
    <div id="ai-assistant-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[80vh] flex flex-col">
                <div class="flex items-center justify-between p-6 border-b">
                    <h3 class="text-lg font-semibold">AI产品助手</h3>
                    <button id="close-ai-assistant" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div id="ai-chat-container" class="flex-1 p-6 overflow-y-auto">
                    <div class="space-y-4">
                        <div class="ai-message">
                            <div class="flex items-start gap-3">
                                <div class="w-8 h-8 bg-jytek-blue rounded-full flex items-center justify-center">
                                    <i class="fas fa-robot text-white text-sm"></i>
                                </div>
                                <div class="flex-1">
                                    <p class="text-sm text-gray-600">您好！我是简仪科技的AI产品助手。我可以帮您：</p>
                                    <ul class="text-sm text-gray-600 mt-2 space-y-1">
                                        <li>• 推荐适合的产品</li>
                                        <li>• 解答技术问题</li>
                                        <li>• 对比产品规格</li>
                                        <li>• 提供解决方案建议</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="p-6 border-t">
                    <div class="flex gap-2">
                        <input type="text" id="ai-input" placeholder="请输入您的问题..." 
                               class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-jytek-blue focus:border-transparent">
                        <button id="send-ai-message" class="bg-jytek-blue hover:bg-jytek-light-blue text-white px-6 py-2 rounded-lg transition-colors">
                            发送
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 产品详情模态框 -->
    <div id="product-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl max-h-[90vh] overflow-y-auto">
                <div class="flex items-center justify-between p-6 border-b">
                    <h3 id="modal-product-name" class="text-xl font-semibold"></h3>
                    <button id="close-product-modal" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="p-6">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div>
                            <div class="bg-gray-100 rounded-lg p-8 mb-6">
                                <div class="text-center text-gray-500">
                                    <i class="fas fa-image text-4xl mb-2"></i>
                                    <p>产品图片</p>
                                </div>
                            </div>
                            <div class="space-y-4">
                                <div class="flex justify-between">
                                    <span class="text-gray-600">产品型号:</span>
                                    <span id="modal-part-number" class="font-medium"></span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-600">产品分类:</span>
                                    <span id="modal-category" class="font-medium"></span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-600">价格:</span>
                                    <span id="modal-price" class="font-medium text-jytek-blue"></span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-600">库存状态:</span>
                                    <span id="modal-stock-status" class="font-medium"></span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-600">供货周期:</span>
                                    <span id="modal-delivery-period" class="font-medium"></span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <h4 class="text-lg font-semibold mb-4">产品描述</h4>
                            <p id="modal-description" class="text-gray-600 mb-6"></p>
                            
                            <h4 class="text-lg font-semibold mb-4">技术规格</h4>
                            <div id="modal-specifications" class="mb-6"></div>
                            
                            <div class="flex gap-3">
                                <button onclick="contactSales()" class="flex-1 bg-jytek-blue hover:bg-jytek-light-blue text-white py-2 px-4 rounded-lg transition-colors">
                                    <i class="fas fa-envelope mr-2"></i>联系销售
                                </button>
                                <button onclick="downloadDatasheet()" class="flex-1 border border-jytek-blue text-jytek-blue hover:bg-jytek-blue hover:text-white py-2 px-4 rounded-lg transition-colors">
                                    <i class="fas fa-download mr-2"></i>下载资料
                                </button>
                                <button onclick="askAI()" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors">
                                    <i class="fas fa-robot mr-2"></i>询问AI
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 产品对比模态框 -->
    <div id="compare-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl w-full max-w-6xl max-h-[90vh] overflow-y-auto">
                <div class="flex items-center justify-between p-6 border-b">
                    <h3 class="text-xl font-semibold">产品对比</h3>
                    <button id="close-compare-modal" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div id="compare-content" class="p-6">
                    <!-- 对比内容将在这里动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 移动端筛选面板 -->
    <div id="mobile-filters" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 lg:hidden">
        <div class="flex justify-end">
            <div class="bg-white w-80 h-full overflow-y-auto">
                <div class="p-4 border-b">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-semibold">筛选条件</h3>
                        <button id="close-mobile-filters" class="text-gray-400 hover:text-gray-600">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                <div id="mobile-filters-content" class="p-4">
                    <!-- 移动端筛选内容将复制桌面端的筛选面板 -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/products.js"></script>
</body>
</html>
